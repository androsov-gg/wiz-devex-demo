version: '3'

vars:
  PROJECT_ID:
    sh: gcloud config get-value project 2>/dev/null || echo "$PROJECT_ID"
  REGION:
    sh: echo "${REGION:-europe-west1}"
  SERVICE_NAME: wiz-ide-demo-platform
  STATE_BUCKET: '{{.PROJECT_ID}}-{{.SERVICE_NAME}}-tfstate'
  PORTAL_IMAGE: '{{.REGION}}-docker.pkg.dev/{{.PROJECT_ID}}/{{.SERVICE_NAME}}/portal:latest'

tasks:
  default:
    desc: 'Show list of available tasks'
    cmds:
      - task --list

  bootstrap:
    desc: '🚀 1-Click setup: creates remote Terraform state bucket'
    cmds:
      - |
        if ! gcloud storage buckets describe "gs://{{.STATE_BUCKET}}" >/dev/null 2>&1; then
          gcloud storage buckets create "gs://{{.STATE_BUCKET}}" --location="{{.REGION}}" --uniform-bucket-level-access
          echo "✅ Remote state bucket 'gs://{{.STATE_BUCKET}}' created."
        else
          echo "ℹ️ Remote state bucket 'gs://{{.STATE_BUCKET}}' already exists."
        fi

  init:
    desc: '🔧 Initialize Terraform with the remote GCS state bucket'
    cmds:
      - terraform init -backend-config="bucket={{.STATE_BUCKET}}"

  plan:
    desc: '📋 Run Terraform plan'
    cmds:
      - terraform plan

  apply:
    desc: '⚡ Complete infrastructure deployment (APIs, AR, Builder SA, Image Build, GCS, Firestore, Cloud Run)'
    cmds:
      - terraform apply

  url:
    desc: '🌐 Output the direct IAP-secured Portal URL'
    cmds:
      - terraform output portal_url

  destroy:
    desc: '🧹 Tear down all infrastructure provisioned by Terraform'
    cmds:
      - terraform destroy

  'dev:deps':
    desc: '📦 Download Go backend and React frontend dependencies for local IDE support'
    cmds:
      - cd portal/backend && go mod tidy
      - cd portal/frontend && npm install

  'dev:refresh-portal':
    desc: '🔄 Force Cloud Run to re-pull the latest container image and deploy a new revision'
    cmds:
      - gcloud run services update {{.SERVICE_NAME}} --region={{.REGION}} --image="{{.PORTAL_IMAGE}}"
