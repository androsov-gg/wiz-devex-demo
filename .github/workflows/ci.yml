name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'deployer-cli/go.mod'
          cache-dependency-path: 'deployer-cli/go.sum'

      - name: Run Tests
        run: |
          cd deployer-cli
          go test -v ./...

      - name: Verify CLI Build
        run: |
          make build-cli
